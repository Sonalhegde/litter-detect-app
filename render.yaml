services:
  - type: web
    runtime: docker
    # This blueprint builds the PYTHON inference backend (backend/Dockerfile).
    # It must keep the name of the dashboard's Python service
    # (litter-detect-inference.onrender.com) so a blueprint sync updates that
    # service instead of touching the separate Node service
    # (sentinal-yhe0.onrender.com) the frontend currently calls. If you
    # consolidate to a single backend, rename here AND update
    # client/src/lib/detection.ts + .github/workflows/render-keepalive.yml.
    name: litter-detect-inference
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: "https://bluesentinel-ai.vercel.app,https://sentinalapp.vercel.app,https://litter-detect-app.vercel.app,https://sentinal-theta.vercel.app"
      - key: YOLO26S_MODEL_PATH
        value: /app/models/yolo26s.onnx
      - key: YOLO26S_MODEL_SHA256
        value: 969bbf4733dd1486478e55cbb511569dc0bb7a75cf889597274b02b336b3ceb2
      - key: YOLO26N_MODEL_PATH
        value: /app/models/yolo26n.pt
      - key: YOLO26M_MODEL_PATH
        value: /app/models/yolo26m.pt
      - key: YOLO26L_MODEL_PATH
        value: /app/models/yolo26l.pt
      - key: YOLO26X_MODEL_PATH
        value: /app/models/yolo26x.pt
      - key: INFERENCE_IMAGE_SIZE
        value: "320"
      - key: INFERENCE_CONFIDENCE_THRESHOLD
        value: "0.25"
      - key: INFERENCE_IOU_THRESHOLD
        value: "0.45"
      - key: MAX_UPLOAD_MB
        value: "8"
      - key: MAX_IMAGE_WIDTH
        value: "3000"
      - key: MAX_IMAGE_HEIGHT
        value: "3000"
      - key: MAX_IMAGE_PIXELS
        value: "6000000"
      - key: INFERENCE_CONCURRENCY
        value: "1"
      - key: RATE_LIMIT_REQUESTS
        value: "6"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
