name: Keep Render inference warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        run: curl --fail --silent --show-error --max-time 30 https://litter-detect-inference.onrender.com/health > /dev/null
